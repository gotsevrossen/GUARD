[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lighthouse-security-copilot"
version = "0.3.2"
description = "Local AI security triage service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "bcrypt>=4.2,<5",
  "pywin32>=308; sys_platform == 'win32'",
  # In-process local inference for the Windows build. Exact pin: it is a native
  # binary. The Linux builds keep Ollama and do not install it.
  "llama-cpp-python==0.3.35; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The native window for the Linux desktop build. Not installed on the appliance,
# which has no display and serves the same dashboard over the LAN instead.
desktop = ["pywebview>=5.1,<6"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "pyinstaller>=6.10,<7"]

[project.scripts]
lighthouse-desktop = "triage.desktop:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["triage*"]

# PyPI publishes llama-cpp-python only as source, which needs a C++ toolchain on
# the build machine. Use the project's prebuilt CPU wheel for Windows instead, by
# direct URL so that uv.lock records its hash (the wheel index publishes none).
[tool.uv.sources]
llama-cpp-python = { url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.35/llama_cpp_python-0.3.35-py3-none-win_amd64.whl", marker = "sys_platform == 'win32'" }
